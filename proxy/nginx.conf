# ============================================================
# HTTP
# ============================================================

server {
    listen 80;
    server_name dp.nrst.ir lm.nrst.ir;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# Django application
# dp.nrst.ir
# ============================================================

server {
    listen 443 ssl;
    server_name dp.nrst.ir;

    ssl_certificate /etc/letsencrypt/live/dp.nrst.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dp.nrst.ir/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}


# ============================================================
# Laravel application
# lm.nrst.ir
# ============================================================

server {
    listen 443 ssl;
    server_name lm.nrst.ir;

    ssl_certificate /etc/letsencrypt/live/lm.nrst.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lm.nrst.ir/privkey.pem;

    location / {
        proxy_pass http://app:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}