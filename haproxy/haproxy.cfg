global
    maxconn 200

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Django's DATABASE_HOST should point here. Patroni's REST API on :8008
# returns HTTP 200 on /primary only for the current primary, so HAProxy
# always routes writes to whichever node just got promoted.
listen postgres_primary
    bind *:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 maxconn 100 check port 8008
    server postgres2 postgres2:5432 maxconn 100 check port 8008
    server postgres3 postgres3:5432 maxconn 100 check port 8008

# Optional: point read-only traffic here later to load-balance across replicas.
listen postgres_replicas
    bind *:5001
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 maxconn 100 check port 8008
    server postgres2 postgres2:5432 maxconn 100 check port 8008
    server postgres3 postgres3:5432 maxconn 100 check port 8008
