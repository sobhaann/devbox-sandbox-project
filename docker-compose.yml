x-patroni-node: &patroni_node
  build: ./patroni
  environment: &patroni_env
    PATRONI_SCOPE: postgres-cluster
    PATRONI_ETCD3_HOSTS: etcd:2379
    PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
    PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
    PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
    PATRONI_SUPERUSER_USERNAME: ${PATRONI_SUPERUSER_USERNAME:-postgres}
    PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
    PATRONI_REPLICATION_USERNAME: ${PATRONI_REPLICATION_USERNAME:-replicator}
    PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
    APP_DB_USER: ${POSTGRES_USER:-django_user}
    APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    APP_DB_NAME: ${POSTGRES_DB:-django_db}
  # Patroni liveness only: is the Patroni process (and its REST API) up.
  # This says nothing about leader election - that's wait_for_primary's job.
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8008/liveness"]
    interval: 5s
    timeout: 5s
    retries: 10
  depends_on:
    etcd:
      condition: service_healthy

services:
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres1:
    <<: *patroni_node
    hostname: postgres1
    environment:
      <<: *patroni_env
      PATRONI_NAME: postgres1
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres1:5432
    volumes:
      - postgres1_data:/var/lib/postgresql/data

  postgres2:
    <<: *patroni_node
    hostname: postgres2
    environment:
      <<: *patroni_env
      PATRONI_NAME: postgres2
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres2:5432
    volumes:
      - postgres2_data:/var/lib/postgresql/data

  postgres3:
    <<: *patroni_node
    hostname: postgres3
    environment:
      <<: *patroni_env
      PATRONI_NAME: postgres3
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres3:5432
    volumes:
      - postgres3_data:/var/lib/postgresql/data

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5000:5000"   # Django connects here (always routed to the primary)
      - "5001:5001"   # optional read-only traffic across replicas
      - "7000:7000"   # stats page: http://localhost:7000/
    # Liveness only: is the haproxy process itself up and serving.
    # Do NOT try to encode "is a primary elected" here by parsing the stats
    # page - the aggregate backend status can read "UP 1/3" during normal
    # startup, not a plain "UP", which made an earlier version of this
    # check fail forever even once a real primary was being routed to.
    # Cluster-readiness is answered once, correctly, by wait_for_primary.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7000/"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres1:
        condition: service_healthy
      postgres2:
        condition: service_healthy
      postgres3:
        condition: service_healthy

  # Single source of truth for "the Postgres cluster has a primary".
  # Asks Patroni directly (not through haproxy) since Patroni is the
  # actual authority on leader election. Exits 0 as soon as any node
  # reports itself primary; exits 1 if none does within the timeout,
  # so a genuinely broken cluster fails fast instead of hanging forever.
  wait_for_primary:
    image: curlimages/curl:8.10.1
    entrypoint: >
      sh -c '
        echo "Waiting for a Postgres primary to be elected...";
        i=0;
        max=60;
        until curl -sf -o /dev/null http://postgres1:8008/primary ||
              curl -sf -o /dev/null http://postgres2:8008/primary ||
              curl -sf -o /dev/null http://postgres3:8008/primary; do
          i=$$((i+1));
          if [ "$$i" -ge "$$max" ]; then
            echo "No primary elected after $$max attempts, giving up.";
            exit 1;
          fi;
          sleep 2;
        done;
        echo "Primary is up.";
      '
    depends_on:
      postgres1:
        condition: service_healthy
      postgres2:
        condition: service_healthy
      postgres3:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    env_file:
      - .env
    depends_on:
      haproxy:
        condition: service_healthy
      wait_for_primary:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
    volumes:
      - .:/app

  db_init:
    build: .
    env_file:
      - .env
    depends_on:
      haproxy:
        condition: service_healthy
      wait_for_primary:
        condition: service_completed_successfully
    # wait_for_primary guarantees Patroni has a leader; this small bounded
    # retry covers only the last-mile gap while haproxy's own internal
    # healthcheck (haproxy.cfg: inter 3s, rise 2) catches up and starts
    # actively routing to that leader - a few seconds at most, not a
    # substitute for the real gate above.
    entrypoint: >
      sh -c '
        n=0;
        until python manage.py migrate || [ $$n -ge 5 ]; do
          n=$$((n+1));
          echo "migrate failed, attempt $$n/5, retrying in 3s...";
          sleep 3;
        done
      '
    restart: "no"

  frontend:
    build: ./frontend
    volumes:
      - frontend_build:/shared

  proxy:
    image: nginx:1.31.4-alpine-slim
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - frontend_build:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_completed_successfully
      web:
        condition: service_started  
    networks:
      - edge

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  etcd_data:
  postgres1_data:
  postgres2_data:
  postgres3_data:
  frontend_build:
  certbot_www:
  certbot_certs:

networks:
  edge:
    external: true
